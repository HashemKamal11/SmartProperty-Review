x-smartproperty-image: &smartproperty-image
  image: smartproperty:${SMARTPROPERTY_IMAGE_TAG:-local}

# The migrator and the api run the same image, so both declare how to build it. That way `docker compose up -d --build`
# (with or without a service name) always rebuilds the current source before starting either one; the second build is a
# layer-cache hit.
x-smartproperty-build: &smartproperty-build
  context: .
  dockerfile: Dockerfile

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: smart_property
      POSTGRES_USER: smart_property
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell before running Docker Compose}
    # No host port is published: the database is reachable only from other services on
    # this project's Compose network, as "postgres:5432". For local development that needs
    # a host port, add the opt-in docker-compose.local.yml override.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ClamAV's daemon. Scans every uploaded legal document over TCP (INSTREAM) before it can be read or approved. Not
  # published to the host. Signature updates (freshclam) run inside the container; the first start downloads the
  # databases and can take a few minutes, during which documents simply wait in quarantine. Needs about 1.5-3 GB of RAM.
  clamav:
    image: clamav/clamav:${CLAMAV_IMAGE_TAG:-stable}
    environment:
      # Must be at least the upload limit (10 MB) plus framing.
      CLAMD_CONF_StreamMaxLength: 32M
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    restart: unless-stopped

  migrator:
    <<: *smartproperty-image
    build: *smartproperty-build
    working_dir: /app/migrator
    entrypoint: ["dotnet", "SmartProperty.Migrator.dll"]
    environment:
      DOTNET_ENVIRONMENT: Staging
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=smart_property;Username=smart_property;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell before running Docker Compose}
      Provisioning__InitialWorkspace__Enabled: ${INITIAL_WORKSPACE_ENABLED:-false}
      Provisioning__InitialWorkspace__Id: ${INITIAL_WORKSPACE_ID:-}
      Provisioning__InitialWorkspace__Name: ${INITIAL_WORKSPACE_NAME:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *smartproperty-image
    build: *smartproperty-build
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_URLS: http://+:8080
      # Reaches PostgreSQL over the Compose network by service name, never via the host.
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=smart_property;Username=smart_property;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell before running Docker Compose}
      Jwt__Issuer: SmartProperty
      Jwt__Audience: SmartProperty.Api
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in your shell before running Docker Compose}
      # TimeSpan values (d.hh:mm:ss). Long values are for local testing only.
      Jwt__AccessTokenLifetime: ${JWT_ACCESS_TOKEN_LIFETIME:-00:15:00}
      Jwt__RefreshTokenLifetime: ${JWT_REFRESH_TOKEN_LIFETIME:-7.00:00:00}
      AiIntegration__ApiKey: ${AI_INTEGRATION_API_KEY:-}
      # The AI search service. Off unless AI_SEARCH_ENABLED=true; the key is sent as x-api-key when properties are
      # added to or removed from it.
      AiSearch__Enabled: ${AI_SEARCH_ENABLED:-false}
      AiSearch__BaseUrl: ${AI_SEARCH_BASE_URL:-https://ai-search.neurix.uk}
      AiSearch__ApiKey: ${AI_SEARCH_API_KEY:-}
      AiSearch__TimeoutSeconds: ${AI_SEARCH_TIMEOUT_SECONDS:-30}
      # The pass that submits closed listings set to relistMode=Automatic for review again.
      AutomaticRelist__WorkerEnabled: ${AUTOMATIC_RELIST_ENABLED:-true}
      # Left empty (not removed), EVERY switches to the fixed RUN_AT times.
      AutomaticRelist__Every: ${AUTOMATIC_RELIST_EVERY-15m}
      AutomaticRelist__RunAt: ${AUTOMATIC_RELIST_RUN_AT:-01:00}
      AutomaticRelist__TimeZoneId: ${AUTOMATIC_RELIST_TIME_ZONE:-Africa/Cairo}
      AutomaticRelist__BatchSize: ${AUTOMATIC_RELIST_BATCH_SIZE:-500}
      AutomaticRelist__RunOnStartup: ${AUTOMATIC_RELIST_RUN_ON_STARTUP:-true}
      # Where uploaded property photos are stored: a mounted volume, so they outlive the container.
      ImageStorage__RootPath: ${IMAGE_STORAGE_PATH:-/data/images}
      # Legal documents (deeds, authorizations, licenses): a separate, private, persistent volume. Never served statically;
      # bytes leave only through the authorized download endpoints. Back it up together with the database (see docs).
      DocumentStorage__RootPath: /data/documents
      # Malware scanning of every uploaded document by ClamAV (clamd). Without a host nothing is scanned, documents stay
      # quarantined (PendingScan) and no authority request can be submitted.
      MalwareScanning__ClamAvHost: ${CLAMAV_HOST:-clamav}
      MalwareScanning__ClamAvPort: ${CLAMAV_PORT:-3310}
      MalwareScanning__TimeoutSeconds: ${CLAMAV_TIMEOUT_SECONDS:-120}
      MalwareScanning__MaxAttempts: ${SCAN_MAX_ATTEMPTS:-5}
      MalwareScanning__RetryBaseDelaySeconds: ${SCAN_RETRY_BASE_DELAY_SECONDS:-30}
      MalwareScanning__RetryMaxDelayMinutes: ${SCAN_RETRY_MAX_DELAY_MINUTES:-30}
      # Provisions the Legal Reviewer role and the administrator's marketplace permissions at every start (idempotent).
      StaffRoles__ProvisionOnStartup: "true"
      Bootstrap__Enabled: ${BOOTSTRAP_ENABLED:-false}
      Bootstrap__PlatformAdminEmail: ${BOOTSTRAP_PLATFORM_ADMIN_EMAIL:-}
      # TEMPORARY: true marks a registered phone number as verified without sending an SMS. Keep false once SMS works.
      ContactVerification__AutoVerifyPhone: ${AUTO_VERIFY_PHONE:-false}
      # Email through SMTP. Leave SMTP_HOST empty to use the logging stand-in that sends nothing.
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Smtp__UserName: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-}
      Smtp__FromName: ${SMTP_FROM_NAME:-SmartProperty}
      Smtp__TimeoutSeconds: ${SMTP_TIMEOUT_SECONDS:-60}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN_0:-}
      Cors__AllowedOrigins__1: ${CORS_ALLOWED_ORIGIN_1:-}
      Share__PublicBaseUrl: ${SHARE_PUBLIC_BASE_URL:-}
      Share__PropertyPath: ${SHARE_PROPERTY_PATH:-/properties/{id}}
    volumes:
      - ${IMAGE_STORAGE_HOST_PATH:-./Storage}:/data/images
      - documents_data:/data/documents
    ports:
      - "${API_PORT:-5000}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      # Started with the API, but not awaited: uploads are accepted and wait in quarantine until clamd is ready.
      clamav:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  # Legal documents. Persistent and private; include it in backups.
  documents_data:
  # ClamAV signature databases, so a restart does not download them again.
  clamav_db:
